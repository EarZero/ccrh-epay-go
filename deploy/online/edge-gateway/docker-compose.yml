services:
  ccrh-edge-caddy:
    image: caddy:2.8-alpine
    container_name: ccrh-edge-caddy
    restart: unless-stopped
    environment:
      PAY_SITE_ADDRESS: ${PAY_SITE_ADDRESS:?PAY_SITE_ADDRESS must be set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./data/caddy
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ./data/caddy-config
        target: /config
        bind:
          create_host_path: true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - ccrh-edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ccrh-edge:
    name: ccrh-edge
    external: true
